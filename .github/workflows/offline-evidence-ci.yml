name: Offline evidence CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-offline-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Python syntax
        run: python3 -m compileall -q benchmark tests

      - name: Shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
